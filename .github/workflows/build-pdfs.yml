name: Build and Deploy PDFs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./pdf-generator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Pull repository files
      uses: actions/checkout@v6

    # Temporary workaround for Ubuntu 23.10+ AppArmor restrictions
    - name: Enable unprivileged user namespaces
      run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

    - name: Load and cache Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: 'pdf-generator/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Build all PDFs
      run: npm run build:all

    - name: Stage site for deployment
      run: |
        mkdir -p ../site
        cp ../*.pdf ../site/
        cp ../index.html ../site/
        cp -R ../assets ../site/
        echo "documents.washingtonyachtclub.org" > ../site/CNAME

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

  verify-handoff:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: List and download the Pages artifact
      uses: actions/download-artifact@v5
      with:
        pattern: github-pages
        path: downloaded
    - name: Verify the downloaded archive
      working-directory: .
      run: |
        find downloaded -type f
        archive=$(find downloaded -type f -name artifact.tar)
        tar -tf "$archive"
        mkdir unpacked
        tar -xf "$archive" -C unpacked
        test "$(cat unpacked/CNAME)" = documents.washingtonyachtclub.org
        test -s unpacked/index.html
        test -s unpacked/assets/site.css
        test "$(find unpacked -name 'WYC_*.pdf' | wc -l)" -eq 5
