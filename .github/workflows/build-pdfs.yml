name: Build PDFs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
    - name: Pull repository files
      uses: actions/checkout@v3
      
    - name: Load and cache Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: '**/.github/workflows/*.yml'
      
    - name: Build Constitution
      run: npx md-to-pdf --config-file ./wyc_md-to-pdf_config.json WYC_Constitution.md
      
    - name: Build By-Laws
      run: npx md-to-pdf --config-file ./wyc_md-to-pdf_config.json WYC_By-Laws.md
      
    - name: Build Policies
      run: npx md-to-pdf --config-file ./wyc_md-to-pdf_config.json WYC_Policies.md
      
    - name: Build Ithaka Appendix
      run: npx md-to-pdf --config-file ./wyc_md-to-pdf_config.json WYC_Ithaka_Appendix.md
      
    - name: Archive PDFs
      uses: actions/upload-artifact@v3
      with:
        name: wyc-doc-pdfs
        path: |
          *.pdf
          
    - name: Download PDFs
      uses: actions/download-artifact@v3
      with:
        name: wyc-doc-pdfs-${{ github.run_id }}

    - name: Notify Success
      if: success()
      run: echo "PDF build completed successfully."

    - name: Notify Failure
      if: failure()
      run: echo "PDF build failed. Check the logs for details."
